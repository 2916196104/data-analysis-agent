[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analysis-agent"
version = "0.1.0"
description = "Local CSV sales analysis tools, ready for a later single-agent integration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.8,<4"]

[project.scripts]
sales-analysis = "data_analysis_agent.main:main"

[tool.setuptools.packages.find]
where = ["src"]
