[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analysis-agent"
version = "0.2.0"
description = "Local CSV sales analysis with a single HelloAgents tool-calling agent."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.8,<4",
    "hello-agents==1.0.1",
    "python-dotenv>=1.2.4,<1.3",
]

[project.scripts]
sales-analysis = "data_analysis_agent.main:main"
sales-agent = "data_analysis_agent.agent_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
