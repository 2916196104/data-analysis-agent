[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analysis-agent"
version = "0.3.0"
description = "Local sales analysis agent and streaming Amazon review imports into SQLite."
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "matplotlib>=3.8,<4",
    "hello-agents==1.0.1",
    "python-dotenv>=1.2.4,<1.3",
    "openpyxl==3.1.5",
    "defusedxml==0.7.1",
    "openai>=1.109,<2",
    "pydantic>=2,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "psycopg[binary]>=3.2,<4",
    "redis>=5,<7",
]

[project.optional-dependencies]
test-queue = ["fakeredis[lua]>=2.30,<3"]

[project.scripts]
sales-analysis = "data_analysis_agent.cli.sales:main"
sales-agent = "data_analysis_agent.cli.agent:main"
review-import = "data_analysis_agent.cli.reviews:main"
review-label = "data_analysis_agent.cli.labeling:main"
review-analysis = "data_analysis_agent.cli.analytics:main"
review-monitor = "data_analysis_agent.cli.monitoring:main"
review-workbench = "data_analysis_agent.cli.workbench:main"
review-api = "data_analysis_agent.cli.server:main"
review-migrate = "data_analysis_agent.cli.migrate:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/data-analysis-agent/workbench" = [
    "frontend/workbench/index.html",
    "frontend/workbench/workbench.css",
    "frontend/workbench/workbench.js",
]
