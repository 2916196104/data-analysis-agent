<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>证据人工评审</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#18352d;font:16px/1.7 system-ui,sans-serif}main{max-width:1050px;margin:auto;padding:24px}h1{font-size:24px}h2{font-size:20px}header,section,article{background:white;border:1px solid #dbe5df;border-radius:10px;padding:20px;margin:16px 0}label{display:block;margin:12px 0}input,select,textarea,button{font:inherit;max-width:100%;padding:8px;border:1px solid #aabfb3;border-radius:5px}textarea{display:block;width:100%;min-height:80px}button{background:#087d57;color:white;cursor:pointer;margin:4px}small,.muted{color:#557064}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f6f8f7;padding:12px}mark{background:#ffedaa}blockquote{margin:12px 0;padding:12px;border-left:4px solid #087d57;background:#f4faf6;white-space:pre-wrap}details{margin:12px 0;overflow-wrap:anywhere}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:180px}fieldset{border:1px solid #dbe5df;border-radius:6px;margin:12px 0}#caseSelect{width:100%}.notice{color:#7c4314}#message{white-space:pre-wrap}p{overflow-wrap:anywhere}
</style></head><body><main><h1>证据人工评审</h1>
<header><p>先核对问题与目标事实，再逐项查看证据。只允许高亮 quote 内的事实支持结论；完整评论仅用于解释、限定或否决。未查看不等于不支持。</p>
<p class="notice">当前只保存未确认草稿。单人初评，无双人盲审或独立裁决声明。请记录是否接触过历史相关性评分。</p>
<div class="row"><label>评审人代号 <input id="reviewer" placeholder="由本人填写"></label><label>既往评分接触情况 <select id="exposure"><option value="">待本人声明</option value="not_seen">未接触</option><option value="seen">曾接触</option><option value="unsure">不确定</option></select></label></div>
<label>评审条目 <select id="caseSelect"></select></label><button id="previous">上一项</button><button id="next">下一项</button><button id="save">导出全部草稿</button><label>恢复本页导出的草稿 <input type="file" id="restore" accept="application/json"></label><p id="message" role="status"></p></header>
<section><h2 id="question"></h2><p id="contextInfo" class="muted"></p><details><summary>查询契约草稿（待人工确认）</summary><pre id="contract"></pre></details><label>契约初评意见 <select id="contractDecision"><option value="pending">尚未核对</option><option value="accept_draft">草稿含义符合原问题（仍待正式确认）</option><option value="needs_revision">需要修订后再评审</option></select></label><label>契约修订建议（特别确认必要关系、歧义和可独立子问题）<textarea id="contractNotes"></textarea></label><p id="independent"></p><label>建议可独立回答的目标事实 ID（逗号分隔；留空表示尚未声明）<input id="independentProposal"></label></section>
<section><h2>候选证据</h2><p>添加引用只记录片段，不会自动认定直接支持。请在下方事实项中选择支持程度和填写理由。</p><label>添加引用的目标事实 <select id="activeFact"></select></label><div id="evidence"></div></section>
<section><h2>逐事实与必要关系</h2><div id="facts"></div><div id="relations"></div></section>
<section><h2>本条评审草稿</h2><label>参考状态 <select id="state"><option value="">未评审</option><option value="sufficient">sufficient — 核心事实及必要关系得到支持</option><option value="limited">limited — 仅有可独立回答的目标得到支持</option><option value="insufficient">insufficient — 核心结论没有充分直接支持</option></select></label>
<label>可许可的目标事实 ID（逗号分隔；不是复合条件的任意一部分）<input id="supported"></label><label>缺失的必要事实 ID（未评审时留空）<input id="missing"></label><label>不足、上下文否决、分歧及单人评审限制说明<textarea id="notes"></textarea></label></section>
</main><script type="application/json" id="payload">__PAYLOAD_JSON__</script><script>
'use strict';
const INITIAL=JSON.parse(document.getElementById('payload').textContent);
let cases=structuredClone(INITIAL.cases), index=0, dirty=false;
const $=id=>document.getElementById(id), ids=text=>text.split(',').map(x=>x.trim()).filter(Boolean);
const message=text=>{$('message').textContent=text;};
function element(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e;}
function selected(){return cases[index];}
function sync(){const c=selected();c.reference_state=$('state').value||null;c.supported_target_fact_ids=ids($('supported').value);c.missing_required_fact_ids=ids($('missing').value);c.review_notes=$('notes').value;c.contract_notes=$('contractNotes').value;c.contract_review_decision=$('contractDecision').value;c.proposed_independent_target_fact_ids=ids($('independentProposal').value);dirty=true;}
function validRefs(refs,c){return Array.isArray(refs)&&new Set(refs.map(r=>JSON.stringify(r))).size===refs.length&&refs.every(r=>{const h=c.candidates.find(h=>h.key===r.key);return h&&Number.isInteger(r.quote_start)&&Number.isInteger(r.quote_end)&&r.quote_start>=h.quote_start&&r.quote_end<=h.quote_end&&r.quote_start<r.quote_end;});}
function restoreDraft(value){
 if(value.version!=='local-evidence-review-draft-v1'||value.source_input_sha256!==INITIAL.source_input_sha256||value.human_confirmed!==false||value.reviewer_count!==1||!Array.isArray(value.cases)||value.cases.length!==INITIAL.cases.length)throw Error();
 if(value.reviewer_id!==null&&typeof value.reviewer_id!=='string'||![null,'not_seen','seen','unsure'].includes(value.prior_relevance_exposure))throw Error();
 const allowed=['reference_state','supported_target_fact_ids','missing_required_fact_ids','review_notes','contract_notes','contract_review_decision','proposed_independent_target_fact_ids','fact_findings','relation_findings'];
 const result=INITIAL.cases.map((original,i)=>{const c=value.cases[i],facts=original.contract.required_facts.items.map(f=>f.id),keys=original.candidates.map(h=>h.key);
  for(const key of Object.keys(original))if(!allowed.includes(key)&&JSON.stringify(c[key])!==JSON.stringify(original[key]))throw Error();
  const factIds=values=>Array.isArray(values)&&new Set(values).size===values.length&&values.every(v=>facts.includes(v));
  if(![null,'sufficient','limited','insufficient'].includes(c.reference_state)||!factIds(c.supported_target_fact_ids)||!factIds(c.missing_required_fact_ids)||!factIds(c.proposed_independent_target_fact_ids||[]))throw Error();
  if(!['pending','accept_draft','needs_revision'].includes(c.contract_review_decision||'pending')||typeof c.review_notes!=='string'||typeof(c.contract_notes||'')!=='string')throw Error();
  if(!Array.isArray(c.fact_findings)||c.fact_findings.length!==original.fact_findings.length||!Array.isArray(c.relation_findings)||c.relation_findings.length!==original.relation_findings.length)throw Error();
  for(const [j,f] of c.fact_findings.entries())if(f.fact_id!==original.fact_findings[j].fact_id||!['unknown','direct','partial','not_supported'].includes(f.support)||typeof f.rationale!=='string'||!validRefs(f.evidence_refs,original))throw Error();
  for(const [j,r] of c.relation_findings.entries())if(r.relation_id!==original.relation_findings[j].relation_id||!['unknown','supported','not_supported'].includes(r.support)||typeof r.rationale!=='string'||!Array.isArray(r.evidence_keys)||new Set(r.evidence_keys).size!==r.evidence_keys.length||!r.evidence_keys.every(k=>keys.includes(k)))throw Error();
  const row=structuredClone(original);for(const k of allowed)if(k in c)row[k]=structuredClone(c[k]);return row;});
 return result;
}
function options(values,value,onchange){const e=element('select');for(const [v,t] of values){const o=element('option',t);o.value=v;e.append(o);}e.value=value;e.addEventListener('change',()=>{onchange(e.value);dirty=true;});return e;}
function field(label,value,onchange){const l=element('label',label), t=element('textarea');t.value=value;t.addEventListener('input',()=>{onchange(t.value);dirty=true;});l.append(t);return l;}
function render(){const c=selected();$('caseSelect').value=String(index);$('question').textContent=c.case_id+' · '+c.question;$('contextInfo').textContent='上下文：完整评论仅用于解释或否决；版本 '+c.context_version+'；输入摘要 '+c.context_input_sha256;$('contract').textContent=JSON.stringify(c.contract,null,2);$('independent').textContent='可独立回答的子问题草稿：'+(c.independent_target_fact_ids.join(', ')||'尚未声明；须人工确认');$('state').value=c.reference_state||'';$('supported').value=c.supported_target_fact_ids.join(', ');$('missing').value=c.missing_required_fact_ids.join(', ');$('notes').value=c.review_notes||'';$('contractNotes').value=c.contract_notes||'';$('contractDecision').value=c.contract_review_decision||'pending';$('independentProposal').value=(c.proposed_independent_target_fact_ids||[]).join(', ');
 $('activeFact').replaceChildren();for(const f of c.contract.required_facts.items){const o=element('option',f.id+' · '+f.description);o.value=f.id;$('activeFact').append(o);}
 $('evidence').replaceChildren();if(!c.candidates.length)$('evidence').append(element('p','当前列表没有候选；这不证明全量数据不存在证据。'));
 for(const hit of c.candidates){const a=element('article');a.append(element('h3','候选 '+hit.rank),element('blockquote',hit.quote));const d=element('details');d.append(element('summary','查看完整评论及 quote 区间'));const text=element('pre'),points=Array.from(hit.review_text);text.append(document.createTextNode(points.slice(0,hit.quote_start).join('')),element('mark',hit.quote),document.createTextNode(points.slice(hit.quote_end).join('')));d.append(text,element('small','评论 '+hit.review_id+' / 标注 '+hit.annotation_id+' / 区间 ['+hit.quote_start+','+hit.quote_end+')'),element('p','来源 '+hit.evidence_ref),element('p','观点键 '+hit.key));a.append(d);const button=element('button','引用此 quote');button.addEventListener('click',()=>{sync();const finding=c.fact_findings.find(f=>f.fact_id===$('activeFact').value);if(!finding)return;const ref={key:hit.key,quote_start:hit.quote_start,quote_end:hit.quote_end};if(!finding.evidence_refs.some(r=>JSON.stringify(r)===JSON.stringify(ref)))finding.evidence_refs.push(ref);dirty=true;render();message('已记录引用；支持程度仍需人工判断。');});a.append(button);$('evidence').append(a);}
 $('facts').replaceChildren();for(const f of c.fact_findings){const goal=c.contract.required_facts.items.find(g=>g.id===f.fact_id), box=element('fieldset');box.append(element('legend',f.fact_id+' · '+goal.description));box.append(options([['unknown','未完成判断'],['direct','直接支持'],['partial','部分相关'],['not_supported','不支持']],f.support,v=>f.support=v),field('判断理由',f.rationale,v=>f.rationale=v),field('来源引用 JSON（可收窄区间；不得超出 quote）',JSON.stringify(f.evidence_refs,null,2),v=>{try{const refs=JSON.parse(v);if(!Array.isArray(refs))throw Error();for(const r of refs){const h=c.candidates.find(h=>h.key===r.key);if(!h||!Number.isInteger(r.quote_start)||!Number.isInteger(r.quote_end)||r.quote_start<h.quote_start||r.quote_end>h.quote_end||r.quote_start>=r.quote_end)throw Error();}f.evidence_refs=refs;message('引用草稿已记录。');}catch{message('引用未保存：需为当前候选 quote 内的合法区间数组。');}}));$('facts').append(box);}
 $('relations').replaceChildren();for(const r of c.relation_findings){const box=element('fieldset');box.append(element('legend','必要关系 '+r.relation_id),options([['unknown','未完成判断'],['supported','关系得到支持'],['not_supported','关系未得到支持']],r.support,v=>r.support=v),field('关系涉及的观点键（逗号分隔）',r.evidence_keys.join(', '),v=>r.evidence_keys=ids(v)),field('关系判断理由',r.rationale,v=>r.rationale=v));$('relations').append(box);}}
for(const [i,c] of cases.entries()){const o=element('option',c.case_id+' · '+c.question);o.value=String(i);$('caseSelect').append(o);}
$('caseSelect').addEventListener('change',()=>{sync();index=Number($('caseSelect').value);render();});
for(const id of ['state','supported','missing','notes','contractNotes','contractDecision','independentProposal'])$(id).addEventListener('change',sync);
$('previous').addEventListener('click',()=>{sync();index=Math.max(0,index-1);render();});$('next').addEventListener('click',()=>{sync();index=Math.min(cases.length-1,index+1);render();});
$('save').addEventListener('click',()=>{sync();const payload={version:'local-evidence-review-draft-v1',source_input_sha256:INITIAL.source_input_sha256,exported_at:new Date().toISOString(),reviewer_id:$('reviewer').value||null,prior_relevance_exposure:$('exposure').value||null,reviewer_count:1,human_confirmed:false,cases};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=element('a');a.href=url;a.download='evidence-review-draft.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);dirty=false;message('已导出未确认草稿。请保留文件；正式确认还需离线结构与来源校验。');});
$('restore').addEventListener('change',async()=>{try{const value=JSON.parse(await $('restore').files[0].text()),restored=restoreDraft(value);cases=restored;$('reviewer').value=value.reviewer_id||'';$('exposure').value=value.prior_relevance_exposure||'';dirty=true;render();message('草稿已恢复；导入不代表正式校验或确认。');}catch{message('无法恢复：文件身份、契约、证据、上下文或草稿结构不匹配。');}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});render();
</script></body></html>
